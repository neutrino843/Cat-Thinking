name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows quality gates
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: true
      - run: npm ci --ignore-scripts
      - run: npm run check:ci
      - run: npm run audit:all
      - run: npm run audit:prod

  e2e:
    name: Ubuntu Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: true
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  document-fixtures:
    name: LibreOffice document fixture smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install render dependencies
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-cjk
      - run: node scripts/verify-fixtures.mjs
      - run: node scripts/verify-docx-render.mjs

  analysis-service-container:
    name: Analysis service container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build pinned non-root image
        run: docker build --file services/analysis-service/Dockerfile --tag cat-analysis-service:ci .
      - name: Start and probe container
        env:
          ANALYSIS_SERVICE_TOKEN: ci-service-token-with-at-least-thirty-two-bytes
        run: |
          container_id=$(docker run --detach --publish 127.0.0.1:8787:8787 \
            --env ANALYSIS_AUTH_MODE=service-token \
            --env ANALYSIS_SERVICE_TOKEN="$ANALYSIS_SERVICE_TOKEN" \
            --env ANALYSIS_CORS_ORIGINS=https://app.example.test \
            cat-analysis-service:ci)
          trap 'docker logs "$container_id"; docker stop "$container_id"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then exit 1; fi
            sleep 1
          done
          curl --fail --silent \
            --header "Authorization: Bearer $ANALYSIS_SERVICE_TOKEN" \
            --header 'X-Cat-Tenant-Id: ci-tenant' \
            --header 'Origin: https://app.example.test' \
            http://127.0.0.1:8787/api/analysis/v1/capabilities \
            | grep --fixed-strings '"acceptsRuns":false'

  analysis-service-postgres:
    name: Analysis service PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_DB: cat_analysis_test
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cat_analysis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: true
      - run: npm ci --ignore-scripts
      - name: Run durable store restart and concurrency tests
        env:
          ANALYSIS_TEST_DATABASE_URL: postgresql://postgres:integration-only-password@127.0.0.1:5432/cat_analysis_test
        run: npm run coverage:postgres
